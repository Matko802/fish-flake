# MangoWM config (ported from ../niri/config/config.kdl - keep in sync)

# ---- Env ----
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# ---- Autostart (mirrors niri spawn-at-startup) ----
exec-once=quickshell
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=systemctl --user restart hyprpolkitagent
exec-once=gsr-ui

# ---- Input (mirrors niri input block) ----
xkb_rules_layout = sk,us
xkb_rules_variant=qwerty
xkb_rules_options=grp:alt_shift_toggle
repeat_rate=35
repeat_delay=350
numlockon = 1
# niri: mouse accel-profile adaptive, accel-speed 0.0
mouse_accel_profile = 2
mouse_accel_speed = 0.0
# niri touchpad: tap, dwt, accel adaptive 0.0
tap_to_click = 1
trackpad_natural_scrolling = 0
trackpad_accel_profile = 2
trackpad_accel_speed = 0.0
trackpad_disable_while_typing = 1
# niri: focus-follows-mouse
sloppyfocus = 1

# ---- Monitor (mirrors niri output "DP-1") ----
monitorrule=name:^DP-1$,width:2560,height:1440,refresh:200.0,x:0,y:0,scale:1.2

# ---- Appearance (mirrors niri layout: gaps 8, border width 2, urgent #ff0000ff) ----
gappih=8
gappiv=8
gappoh=8
gappov=8
overviewgappi = 2
overviewgappo = 2
borderpx=2
border_radius = 0
rootcolor=0x000000ff
bordercolor=0x444444ff
dropcolor=0x44444466
splitcolor=0xccccccff
focuscolor=0xffffffff
urgentcolor=0xff0000ff
maximizescreencolor = 0xffffffff
scratchpadcolor = 0x9996ffff
globalcolor = 0xffffffff
overlaycolor = 0xffffffff

# ---- Layout (scroller ~= niri columns, all tags) ----
tagrule=id:0,layout_name:scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# ---- Blur ----
blur=0
blur_optimized=1
blur_params_radius = 8
blur_params_num_passes=2
blur_params_brightness=1.0
blur_params_contrast=1.0
blur_params_saturation=1.2

# ---- Animations (niri uses defaults / slowdown 1.0) ----
animations=1
layer_animations = 0
animation_type_open = slide
animation_type_close = slide
animation_fade_in=1
animation_fade_out=1
animation_duration_move = 311
animation_duration_open = 350
animation_duration_tag=300
animation_duration_close=350
animation_duration_focus=150
animation_curve_open=0.18,0.62,0.32,1.00
animation_curve_move = 0.18,0.62,0.32,1.00
animation_curve_tag=0.18,0.62,0.32,1.00
animation_curve_close=0.18,0.62,0.32,1.00
animation_curve_focus=0.28,0.00,0.22,1.00
animation_curve_opafadein=0.18,0.62,0.32,1.00
animation_curve_opafadeout=0.18,0.62,0.32,1.00

# ---- Sub-configs ----
source=./keybinds.conf
source=./windowrules.conf

new_is_master = 1
enable_floating_snap = 0
scratchpad_cross_monitor = 0
allow_shortcuts_inhibit = 1
allow_tearing = 0
hdr_depth = 2
syncobj_enable = 1
xwayland_persistence = 0
drag_corner = 4
layer_animation_type_open = slide
layer_animation_type_close = slide
tag_animation_direction = 1
focus_cross_monitor = 0
exchange_cross_monitor = 0
drag_tile_refresh_interval = 8.0
allow_lock_transparent = 1
drag_tile_to_tile = 1
# niri focuses newly opened windows, so match that (was 0 in old mango config)
focus_on_activate = 1
