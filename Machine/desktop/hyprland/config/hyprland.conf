# Sharkshell on Hyprland (ported from ../niri/config/config.kdl - keep in sync)
# Pick session in ly. Quickshell auto-detects Hyprland via Compositor.qml.

$mainMod = SUPER

monitor=DP-1,2560x1440@200,0x0,1.2

exec-once = quickshell
exec-once = gsr-ui
exec-once = sh -c "wl-paste --type text --watch cliphist store"
exec-once = sh -c "wl-paste --type image --watch cliphist store"
exec-once = systemctl --user restart hyprpolkitagent

input {
    kb_layout = sk,us
    kb_variant = qwerty
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        tap-to-click = true
        drag_lock = false
    }
}

general {
    gaps_in = 8
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(a7d293ff)
    col.inactive_border = rgba(43483fff)
    col.urgent_border = rgba(ff0000ff)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

animations {
    enabled = 1
}

dwindle {
    force_split = 2
}

# ---- Apps ----
bind = $mainMod, Return, exec, kitty
bind = $mainMod, C, exec, zeditor
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, lock
bind = $mainMod, Escape, exec, kitty --class btop -e btop
bind = $mainMod, M, exec, powermenu
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, librewolf
bind = $mainMod SHIFT, B, exec, bar
bind = $mainMod, T, togglefloating,
bind = $mainMod, Period, exec, emojipicker
bind = $mainMod, Space, exec, launcher
bind = $mainMod ALT, Space, exec, settingsmenu
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, W, togglespecialworkspace,
bind = $mainMod, V, exec, clipboard
bind = $mainMod, N, exec, clockmenu
bind = $mainMod, P, exec, hyprpicker --autocopy
bind = , Print, exec, grim - | satty -f - --output-filename '/home/matko/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png'
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | satty -f - --output-filename '/home/matko/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png'
bind = , XF86PowerOff, exec, powermenu
bind = , XF86Calculator, exec, gnome-calculator
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause

# ---- Focus ----
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ---- Workspaces ----
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ---- Floating ----
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, class:^(btop)$, size 900 800
windowrule = float, class:^(mpv)$, size 900 800
windowrule = float, class:^(localsend)$, size 900 800
