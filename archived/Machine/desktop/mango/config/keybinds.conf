# Keybindings (ported from ../niri/config/config.kdl - keep in sync)

# ---- Apps ----
bind=SUPER,return,spawn,kitty
bind=SUPER,c,spawn,zeditor
bind=SUPER,q,killclient
bind=SUPER,l,spawn,quickshell ipc call lock lock
bind=SUPER,Escape,spawn,kitty -e btop
bind=SUPER,m,spawn,quickshell ipc call power toggle
bind=SUPER,e,spawn,nautilus
bind=SUPER,b,spawn,librewolf
bind=SUPER+SHIFT,b,spawn,quickshell ipc call bar toggle
bind=SUPER,t,togglefloating
bind=SUPER,period,spawn,quickshell ipc call emoji toggle
bind=SUPER,space,spawn,quickshell ipc call launcher toggle
bind=SUPER+ALT,space,spawn,quickshell ipc call settings toggle
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,w,toggleoverview
bind=SUPER+SHIFT,l,switch_layout
bind=SUPER,v,spawn,quickshell ipc call clipboard toggle
bind=SUPER,n,spawn,quickshell ipc call clock toggle
bind=NONE,Print,spawn_shell,grim - | satty -f - --output-filename '/home/matko/Pictures/Screenshots/screenshot-%Y-%m-%d_%H-%M-%S.png'
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" - | satty -f - --output-filename '/home/matko/Pictures/Screenshots/screenshot-%Y-%m-%d_%H-%M-%S.png'
bind=SUPER,p,spawn,hyprpicker --autocopy
bind=NONE,XF86PowerOff,spawn,quickshell ipc call power toggle
bind=NONE,XF86Calculator,spawn,kcalc

# ---- Hidden workspace (special:hidden -> scratchpad, mango-only) ----
bind=SUPER+SHIFT,h,minimized
bind=SUPER,h,toggle_scratchpad

# ---- Focus / workspace ----
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
# niri consume/expel-window-into-column equiv
bind=SUPER+CTRL,Up,scroller_stack,up
bind=SUPER+CTRL,Down,scroller_stack,down
# niri set-column-width / set-window-height equiv (bindc: resize+center share keys)
bindc=SUPER+ALT,Right,resizewin,+50,+0
bindc=SUPER+ALT,Right,centerwin
bindc=SUPER+ALT,Left,resizewin,-50,+0
bindc=SUPER+ALT,Left,centerwin
bindc=SUPER+ALT,Up,resizewin,+0,-50
bindc=SUPER+ALT,Up,centerwin
bindc=SUPER+ALT,Down,resizewin,+0,+50
bindc=SUPER+ALT,Down,centerwin
# niri switch-preset-column-width equiv
bind=SUPER,a,switch_proportion_preset

# ---- Tags (workspaces 1-10) ----
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,0,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,0,0

# ---- Volume / media (bindl = works when locked, like niri allow-when-locked) ----
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause

# ---- Mouse ----
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
bind=SUPER+SHIFT,r,reload_config

# ---- Keyboard Layout (Alt+Shift via xkb_rules_options in config.conf) ----
# NOTE: SUPER+SHIFT+l is switch_layout (matches niri Mod+Shift+L).
# Cycle keyboard layout with Alt+Shift, or query with: mmsg get keyboardlayout
